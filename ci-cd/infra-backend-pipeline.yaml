  TerraformPlanTestBuild:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${AWS::StackName}-tf-plan-test'
      ServiceRole: !GetAtt CodeBuildTerraformRoleTest.Arn
      Source:
        Type: CODEPIPELINE
        BuildSpec: infra-backend/buildspec-plan.yml
      Environment:
        Type: ARM_CONTAINER
        Image: aws/codebuild/amazonlinux2-aarch64-standard:3.0
        ComputeType: BUILD_GENERAL1_MEDIUM
        EnvironmentVariables:
          - Name: ENV
            Value: test
      Artifacts:
        Type: CODEPIPELINE
      TimeoutInMinutes: 45
      Tags:
        - Key: Project
          Value: ImpulsoIQ
        - Key: Environment
          Value: test

  TerraformDeployTestBuild:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${AWS::StackName}-tf-deploy-test'
      ServiceRole: !GetAtt CodeBuildTerraformRoleTest.Arn
      Source:
        Type: CODEPIPELINE
        BuildSpec: infra-backend/buildspec-apply.yml
      Environment:
        Type: ARM_CONTAINER
        Image: aws/codebuild/amazonlinux2-aarch64-standard:3.0
        ComputeType: BUILD_GENERAL1_MEDIUM
        EnvironmentVariables:
          - Name: ENV
            Value: test
      Artifacts:
        Type: CODEPIPELINE
      TimeoutInMinutes: 60
      Tags:
        - Key: Project
          Value: ImpulsoIQ
        - Key: Environment
          Value: test

  # ─── CodeBuild Projects — Prod ───────────────────────────────────────────────

  TerraformValidateProdBuild:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${AWS::StackName}-tf-validate-prod'
      ServiceRole: !GetAtt CodeBuildTerraformRoleProd.Arn
      Source:
        Type: CODEPIPELINE
        BuildSpec: infra-backend/buildspec-validate.yml
      Environment:
        Type: ARM_CONTAINER
        Image: aws/codebuild/amazonlinux2-aarch64-standard:3.0
        ComputeType: BUILD_GENERAL1_SMALL
        EnvironmentVariables:
          - Name: ENV
            Value: prod
      Artifacts:
        Type: CODEPIPELINE
      TimeoutInMinutes: 20
      Tags:
        - Key: Project
          Value: ImpulsoIQ
        - Key: Environment
