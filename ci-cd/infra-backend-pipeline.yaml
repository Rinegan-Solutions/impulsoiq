  TerraformValidateTestBuild:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${AWS::StackName}-tf-validate-test'
      ServiceRole: !GetAtt CodeBuildTerraformRoleTest.Arn
      Source:
        Type: CODEPIPELINE
        BuildSpec: infra-backend/buildspec-validate.yml
      Environment:
        Type: ARM_CONTAINER
        Image: aws/codebuild/amazonlinux2-aarch64-standard:3.0
        ComputeType: BUILD_GENERAL1_SMALL
        EnvironmentVariables:
          - Name: ENV
            Value: test
      Artifacts:
        Type: CODEPIPELINE
      TimeoutInMinutes: 20
      Tags:
        - Key: Project
          Value: ImpulsoIQ
        - Key: Environment
