  TerraformPlanProdBuild:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${AWS::StackName}-tf-plan-prod'
      ServiceRole: !GetAtt CodeBuildTerraformRoleProd.Arn
      Source:
        Type: CODEPIPELINE
        BuildSpec: infra-backend/buildspec-plan.yml
      Environment:
        Type: ARM_CONTAINER
        Image: aws/codebuild/amazonlinux2-aarch64-standard:3.0
        ComputeType: BUILD_GENERAL1_MEDIUM
        EnvironmentVariables:
          - Name: ENV
            Value: prod
      Artifacts:
        Type: CODEPIPELINE
      TimeoutInMinutes: 45
      Tags:
        - Key: Project
          Value: ImpulsoIQ
        - Key: Environment
          Value: prod

  TerraformDeployProdBuild:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${AWS::StackName}-tf-deploy-prod'
      ServiceRole: !GetAtt CodeBuildTerraformRoleProd.Arn
      Source:
        Type: CODEPIPELINE
        BuildSpec: infra-backend/buildspec-apply.yml
      Environment:
        Type: ARM_CONTAINER
        Image: aws/codebuild/amazonlinux2-aarch64-standard:3.0
        ComputeType: BUILD_GENERAL1_MEDIUM
        EnvironmentVariables:
          - Name: ENV
            Value: prod
      Artifacts:
        Type: CODEPIPELINE
      TimeoutInMinutes: 60
      Tags:
        - Key: Project
          Value: ImpulsoIQ
        - Key: Environment
          Value: prod

  # ─── Agent container images (ARM64) ─────────────────────────────────────────
  # Every aws_bedrockagentcore_agent_runtime points at <ecr>:latest, so these
  # images must exist before Terraform can create the runtimes.
  # PrivilegedMode is required for docker build inside CodeBuild.

  AgentImageBuildDev:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${AWS::StackName}-agent-images-dev'
      ServiceRole: !GetAtt CodeBuildTerraformRoleDev.Arn
      Source:
        Type: CODEPIPELINE
        BuildSpec: infra-backend/buildspec-agents.yml
      Environment:
        Type: ARM_CONTAINER
        Image: aws/codebuild/amazonlinux2-aarch64-standard:3.0
        ComputeType: BUILD_GENERAL1_LARGE
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: ENV
            Value: dev
      Artifacts:
        Type: CODEPIPELINE
      TimeoutInMinutes: 60
      Tags:
        - Key: Project
          Value: ImpulsoIQ
        - Key: Environment
          Value: dev

  AgentImageBuildTest:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${AWS::StackName}-agent-images-test'
      ServiceRole: !GetAtt CodeBuildTerraformRoleTest.Arn
      Source:
        Type: CODEPIPELINE
        BuildSpec: infra-backend/buildspec-agents.yml
      Environment:
        Type: ARM_CONTAINER
        Image: aws/codebuild/amazonlinux2-aarch64-standard:3.0
        ComputeType: BUILD_GENERAL1_LARGE
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: ENV
            Value: test
      Artifacts:
        Type: CODEPIPELINE
      TimeoutInMinutes: 60
      Tags:
        - Key: Project
          Value: ImpulsoIQ
        - Key: Environment
          Value: test

  AgentImageBuildProd:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${AWS::StackName}-agent-images-prod'
      ServiceRole: !GetAtt CodeBuildTerraformRoleProd.Arn
      Source:
        Type: CODEPIPELINE
        BuildSpec: infra-backend/buildspec-agents.yml
      Environment:
        Type: ARM_CONTAINER
        Image: aws/codebuild/amazonlinux2-aarch64-standard:3.0
        ComputeType: BUILD_GENERAL1_LARGE
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: ENV
            Value: prod
      Artifacts:
        Type: CODEPIPELINE
      TimeoutInMinutes: 60
      Tags:
        - Key: Project
          Value: ImpulsoIQ
        - Key: Environment
          Value: prod

  # ─── Pipeline 1: Non-Prod (develop → dev → test) ─────────────────────────────
  NonProdPipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub '${AWS::StackName}-nonprod'
      RoleArn: !GetAtt CodePipelineRole.Arn
      PipelineType: V2
      ArtifactStore:
        Type: S3
        Location: !Ref PipelineArtifactsBucket
      Tags:
        - Key: Project
          Value: ImpulsoIQ
        - Key: Environment
          Value: NonProd
      Stages:
        # Stage 1: Source — develop branch (CodePipeline requires Source-only stage)
        - Name: Source
          Actions:
            - Name: SourceDev
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: '1'
              OutputArtifacts:
                - Name: SourceOutputDev
              Configuration:
                ConnectionArn: !Ref GitHubConnectionArn
                FullRepositoryId: !Sub '${GitHubOwner}/${GitHubRepo}'
                BranchName: develop
                DetectChanges: true
                OutputArtifactFormat: CODE_ZIP
              RunOrder: 1

        # Stage 2: Deploy Dev
        - Name: DeployDev
          Actions:
            - Name: AgentImageBuildDev
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              InputArtifacts:
                - Name: SourceOutputDev
              OutputArtifacts:
                - Name: AgentImageOutputDev
              Configuration:
                ProjectName: !Ref AgentImageBuildDev
              RunOrder: 1

            - Name: TerraformValidateDev
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              InputArtifacts:
                - Name: SourceOutputDev
              OutputArtifacts:
                - Name: TerraformValidateOutputDev
              Configuration:
                ProjectName: !Ref TerraformValidateDevBuild
              RunOrder: 2

            - Name: TerraformPlanDev
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              InputArtifacts:
                - Name: SourceOutputDev
              OutputArtifacts:
                - Name: TerraformPlanOutputDev
              Configuration:
                ProjectName: !Ref TerraformPlanDevBuild
                PrimarySource: SourceOutputDev
              RunOrder: 3

            - Name: ApproveDevDeploy
              ActionTypeId:
                Category: Approval
                Owner: AWS
                Provider: Manual
                Version: '1'
              Configuration:
                CustomData: |
                  DEV ENVIRONMENT DEPLOYMENT APPROVAL

                  Branch: develop
                  Environment: dev

                  Before approving, review the Terraform plan output in the
                  "TerraformPlanDev" action's CodeBuild logs above (click
                  "Details" on that action in this pipeline execution).

                  Click "Approve" to apply the plan to the DEV environment.
                  Click "Reject" to cancel this deployment.
              RunOrder: 4

            - Name: TerraformDeployDev
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              InputArtifacts:
                - Name: SourceOutputDev
                - Name: TerraformPlanOutputDev
              OutputArtifacts:
                - Name: TerraformDeployOutputDev
              Configuration:
                ProjectName: !Ref TerraformDeployDevBuild
                PrimarySource: SourceOutputDev
              RunOrder: 5

        # Stage 3: Deploy Test
        - Name: DeployTest
          Actions:
            - Name: AgentImageBuildTest
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              InputArtifacts:
                - Name: SourceOutputDev
              OutputArtifacts:
                - Name: AgentImageOutputTest
              Configuration:
                ProjectName: !Ref AgentImageBuildTest
              RunOrder: 1

            - Name: TerraformValidateTest
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              InputArtifacts:
                - Name: SourceOutputDev
              OutputArtifacts:
                - Name: TerraformValidateOutputTest
              Configuration:
                ProjectName: !Ref TerraformValidateTestBuild
              RunOrder: 2

            - Name: TerraformPlanTest
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              InputArtifacts:
                - Name: SourceOutputDev
              OutputArtifacts:
                - Name: TerraformPlanOutputTest
              Configuration:
                ProjectName: !Ref TerraformPlanTestBuild
                PrimarySource: SourceOutputDev
              RunOrder: 3

            - Name: ApproveTestDeploy
              ActionTypeId:
                Category: Approval
                Owner: AWS
                Provider: Manual
                Version: '1'
              Configuration:
                CustomData: |
                  TEST ENVIRONMENT DEPLOYMENT APPROVAL

                  Branch: develop
                  Environment: test

                  Dev deployment has completed. Before approving, review the
                  Terraform plan output in the "TerraformPlanTest" action's
                  CodeBuild logs above.

                  Click "Approve" to proceed with Test deployment.
                  Click "Reject" to skip Test deployment.
              RunOrder: 4

            - Name: TerraformDeployTest
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              InputArtifacts:
                - Name: SourceOutputDev
                - Name: TerraformPlanOutputTest
              OutputArtifacts:
                - Name: TerraformDeployOutputTest
              Configuration:
                ProjectName: !Ref TerraformDeployTestBuild
                PrimarySource: SourceOutputDev
              RunOrder: 5

  # ─── Pipeline 2: Prod (main → prod, double gate) ─────────────────────────────
  ProdPipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub '${AWS::StackName}-prod'
      RoleArn: !GetAtt CodePipelineRole.Arn
      PipelineType: V2
      ArtifactStore:
        Type: S3
        Location: !Ref PipelineArtifactsBucket
      Tags:
        - Key: Project
          Value: ImpulsoIQ
        - Key: Environment
          Value: prod
      Stages:
        # Stage 1: Source — main branch
        - Name: Source
          Actions:
            - Name: SourceProd
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: '1'
              OutputArtifacts:
                - Name: SourceOutputProd
              Configuration:
                ConnectionArn: !Ref GitHubConnectionArn
                FullRepositoryId: !Sub '${GitHubOwner}/${GitHubRepo}'
                BranchName: main
                DetectChanges: true
                OutputArtifactFormat: CODE_ZIP
              RunOrder: 1

        # Stage 2: Deploy Prod — double gate (release window, then apply)
        - Name: DeployProd
          Actions:
            - Name: ApproveProdRelease
              ActionTypeId:
                Category: Approval
                Owner: AWS
                Provider: Manual
                Version: '1'
              Configuration:
                CustomData: |
                  PRODUCTION DEPLOYMENT — FIRST GATE (RELEASE WINDOW)

                  Branch: main
                  Environment: prod

                  This gate confirms the release window. Approving starts
                  Terraform validate + plan against PRODUCTION.
                  No infrastructure changes are applied at this gate.
              RunOrder: 1

            - Name: AgentImageBuildProd
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              InputArtifacts:
                - Name: SourceOutputProd
              OutputArtifacts:
                - Name: AgentImageOutputProd
              Configuration:
                ProjectName: !Ref AgentImageBuildProd
              RunOrder: 2

            - Name: TerraformValidateProd
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              InputArtifacts:
                - Name: SourceOutputProd
              OutputArtifacts:
                - Name: TerraformValidateOutputProd
              Configuration:
                ProjectName: !Ref TerraformValidateProdBuild
              RunOrder: 3

            - Name: TerraformPlanProd
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              InputArtifacts:
                - Name: SourceOutputProd
              OutputArtifacts:
                - Name: TerraformPlanOutputProd
              Configuration:
                ProjectName: !Ref TerraformPlanProdBuild
                PrimarySource: SourceOutputProd
              RunOrder: 4

            - Name: ApproveProdApply
              ActionTypeId:
                Category: Approval
                Owner: AWS
                Provider: Manual
                Version: '1'
              Configuration:
                CustomData: |
                  PRODUCTION DEPLOYMENT — SECOND GATE (APPLY)

                  Branch: main
                  Environment: prod

                  Review the Terraform plan output in the "TerraformPlanProd"
                  action's CodeBuild logs above before approving.

                  Approving APPLIES infrastructure changes to PRODUCTION.
              RunOrder: 5

            - Name: TerraformDeployProd
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              InputArtifacts:
                - Name: SourceOutputProd
                - Name: TerraformPlanOutputProd
              OutputArtifacts:
                - Name: TerraformDeployOutputProd
              Configuration:
                ProjectName: !Ref TerraformDeployProdBuild
                PrimarySource: SourceOutputProd
              RunOrder: 6

Outputs:
  NonProdPipelineName:
    Description: Non-prod pipeline (develop → dev → test)
    Value: !Ref NonProdPipeline

  ProdPipelineName:
    Description: Prod pipeline (main → prod, double gate)
    Value: !Ref ProdPipeline

  ArtifactsBucketName:
    Description: Shared pipeline artifacts bucket
    Value: !Ref PipelineArtifactsBucket
