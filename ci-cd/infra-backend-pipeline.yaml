AWSTemplateFormatVersion: '2010-09-09'
Description: 'ImpulsoIQ Backend Infra CI/CD Pipeline - CodePipeline with GitHub, CodeBuild for Terraform (dev + test + prod)'

# ─── Pre-flight ────────────────────────────────────────────────────────────────
# 1. SSM parameter must exist (AVAILABLE status):
#      /impulsoiq/cicd/codeconnections_arn
# 2. Account bootstrap (state bucket + API Gateway CloudWatch role):
#      ./scripts/bootstrap-account.sh eu-west-2
#    Idempotent, needs admin credentials, run once per account/region.
#    - No lock table is needed: backend.hcl sets use_lockfile = true, so the
#      state lock is an S3 conditional write on <key>.tflock in the same bucket.
#    - The API Gateway CloudWatch role is account-global, so it is NOT in any
#      environment's Terraform state. Without it, creating the WebSocket stage
#      fails with "CloudWatch Logs role ARN must be set in account settings".
#
# Deploy (one stack, both pipelines):
#   aws cloudformation deploy \
#     --template-file ci-cd/infra-backend-pipeline.yaml \
#     --stack-name impulsoiq-backend-pipeline \
#     --parameter-overrides GitHubOwner=<owner> GitHubRepo=impulsoiq \
#     --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
#     --region eu-west-2
#
# Branch → environment mapping is carried by the ENV variable on each CodeBuild
# project (dev|test|prod), which selects
# infra-backend/environments/${ENV}/{backend.hcl,terraform.tfvars}.
#
# ─── Deploy stage ordering (deliberate) ────────────────────────────────────────
#   1. AgentImageBuild  — creates any missing ECR repo, builds + pushes the 14
#                         ARM64 agent images
#   2. TerraformValidate
#   3. TerraformPlan
#   4. Manual approval
#   5. TerraformApply
#
# Images are built FIRST because agentcore reads the repositories via
# `data "aws_ecr_repository"`, which resolves at plan time, and because
# AgentCore rejects an agent runtime whose image does not already exist.
# buildspec-agents.yml owns those repositories; Terraform only reads them.

Parameters:
  GitHubOwner:
    Type: String
    Description: GitHub repository owner/username
    Default: 'Rinegan-Solutions'

  GitHubRepo:
    Type: String
    Description: GitHub repository name
    Default: 'impulsoiq'

  GitHubConnectionArn:
    Type: AWS::SSM::Parameter::Value<String>
    Description: SSM parameter holding the CodeConnections GitHub ARN
    Default: /impulsoiq/cicd/codeconnections_arn

Resources:

  # ── Shared artifact bucket (both pipelines) ──────────────────────────────────
  # No BucketName specified — AWS generates a unique lowercase name.
  PipelineArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldArtifacts
            Status: Enabled
            ExpirationInDays: 30
      Tags:
        - Key: Project
          Value: ImpulsoIQ
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Purpose
          Value: PipelineArtifacts

  # ── IAM Role for CodePipeline (shared by both pipelines) ─────────────────────
  CodePipelineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-pipeline-role'
      Tags:
        - Key: Project
          Value: ImpulsoIQ
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Purpose
          Value: CodePipeline
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CodePipelinePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                  - s3:GetBucketVersioning
                  - s3:GetBucketLocation
                Resource:
                  - !Sub '${PipelineArtifactsBucket.Arn}/*'
                  - !GetAtt PipelineArtifactsBucket.Arn
              - Effect: Allow
                Action:
                  - codebuild:BatchGetBuilds
                  - codebuild:StartBuild
                Resource:
                  - !GetAtt TerraformValidateDevBuild.Arn
                  - !GetAtt TerraformPlanDevBuild.Arn
                  - !GetAtt TerraformDeployDevBuild.Arn
                  - !GetAtt TerraformValidateTestBuild.Arn
                  - !GetAtt TerraformPlanTestBuild.Arn
                  - !GetAtt TerraformDeployTestBuild.Arn
                  - !GetAtt TerraformValidateProdBuild.Arn
                  - !GetAtt TerraformPlanProdBuild.Arn
                  - !GetAtt TerraformDeployProdBuild.Arn
                  - !GetAtt AgentImageBuildDev.Arn
                  - !GetAtt AgentImageBuildTest.Arn
                  - !GetAtt AgentImageBuildProd.Arn
              - Effect: Allow
                Action:
                  - codestar-connections:UseConnection
                  - codeconnections:UseConnection
                Resource: !Ref GitHubConnectionArn

  # ─── IAM Roles for CodeBuild — Terraform operations, split per environment ───
  # Each role can only touch its own environment's Terraform state prefix, its
  # own SSM namespace, and resources matching impulsoiq-*-<env>. Services whose
  # Create* calls use AWS-generated opaque IDs (Bedrock/AgentCore, DSQL, Connect,
  # Cognito, API Gateway, AppSync, KMS, CloudTrail) stay on Resource '*' —
  # there is no name-based ARN to scope against at creation time.

  CodeBuildTerraformRoleDev:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-codebuild-terraform-dev-role'
      Tags:
        - Key: Project
          Value: ImpulsoIQ
        - Key: Purpose
          Value: TerraformBuildDev
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CodeBuildTerraformDevPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: PipelineArtifacts
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:GetBucketVersioning
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource:
                  - !Sub '${PipelineArtifactsBucket.Arn}/*'
                  - !GetAtt PipelineArtifactsBucket.Arn
              - Sid: TerraformStateObjectsDev
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: 'arn:aws:s3:::impulsoiq-tf-state/infra-backend/dev/*'
              - Sid: TerraformStateBucketList
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketVersioning
                Resource: 'arn:aws:s3:::impulsoiq-tf-state'
              - Sid: TerraformStateLock
                Effect: Allow
                Action:
                  - dynamodb:DescribeTable
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                Resource: !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/impulsoiq-tf-lock'
              - Sid: DataBucketsDev
                Effect: Allow
                Action:
                  - s3:*
                Resource:
                  - 'arn:aws:s3:::impulsoiq-*-dev'
                  - 'arn:aws:s3:::impulsoiq-*-dev/*'
              - Sid: SsmParametersDev
                Effect: Allow
                Action:
                  - ssm:PutParameter
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:GetParametersByPath
                  - ssm:DeleteParameter
                  - ssm:DeleteParameters
                  - ssm:AddTagsToResource
                  - ssm:ListTagsForResource
                  - ssm:RemoveTagsFromResource
                Resource:
                  - !Sub 'arn:aws:ssm:*:${AWS::AccountId}:parameter/impulsoiq/dev/*'
                  - !Sub 'arn:aws:ssm:*:${AWS::AccountId}:parameter/impulsoiq/cicd/*'
              # DescribeParameters is account-scoped (no resource ARN)
              - Sid: SsmDescribeParameters
                Effect: Allow
                Action:
                  - ssm:DescribeParameters
                Resource: '*'
              - Sid: LambdaDev
                Effect: Allow
                Action:
                  - lambda:*
                Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:impulsoiq-*-dev'
              # Event-source mappings are identified by an opaque UUID
              - Sid: LambdaEventSourceMappings
                Effect: Allow
                Action:
                  - lambda:CreateEventSourceMapping
                  - lambda:DeleteEventSourceMapping
                  - lambda:GetEventSourceMapping
                  - lambda:UpdateEventSourceMapping
                  - lambda:ListEventSourceMappings
                Resource: '*'
              - Sid: DynamoDbDev
                Effect: Allow
                Action:
                  - dynamodb:*
                Resource: !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/impulsoiq-*-dev*'
              - Sid: StepFunctionsDev
                Effect: Allow
                Action:
                  - states:*
                Resource: !Sub 'arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:impulsoiq-*-dev'
              - Sid: EventBridgeDev
                Effect: Allow
                Action:
                  - events:*
                Resource:
                  - !Sub 'arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/impulsoiq-*-dev'
                  - !Sub 'arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/impulsoiq-*-dev'
              - Sid: SchedulerDev
                Effect: Allow
                Action:
                  - scheduler:*
                Resource: !Sub 'arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/impulsoiq-*-dev'
              - Sid: SnsDev
                Effect: Allow
                Action:
                  - sns:*
                Resource: !Sub 'arn:aws:sns:${AWS::Region}:${AWS::AccountId}:impulsoiq-*-dev'
              - Sid: EcrDev
                Effect: Allow
                Action:
                  - ecr:*
                Resource: !Sub 'arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/impulsoiq-*-dev'
              - Sid: EcrAuthToken
                Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: '*'
              - Sid: IamScopedDev
                Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:PassRole
                  # Changing a role's trust policy on an EXISTING role is
                  # UpdateAssumeRolePolicy, not CreateRole -- a distinct action
                  # that CreateRole does not imply. Without it, any edit to an
                  # assume_role_policy fails on the second apply while the first
                  # apply of the same code succeeds.
                  - iam:UpdateAssumeRolePolicy
                  - iam:UpdateRole
                  - iam:UpdateRoleDescription
                  - iam:ListRoleTags
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:TagRole
                  - iam:UntagRole
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/impulsoiq-*-dev'
              - Sid: IamPolicyScopedDev
                Effect: Allow
                Action:
                  - iam:CreatePolicy
                  - iam:DeletePolicy
                  - iam:GetPolicy
                  - iam:GetPolicyVersion
                  - iam:ListPolicyVersions
                  - iam:CreatePolicyVersion
                  - iam:DeletePolicyVersion
                  - iam:TagPolicy
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:policy/impulsoiq-*-dev'
              - Sid: OpaqueIdServices
                Effect: Allow
                Action:
                  - cognito-idp:*
                  - apigateway:*
                  - appsync:*
                  - dsql:*
                  - connect:*
                  # SES: the domain identity and configuration set in
                  # modules/api/ses.tf. Not scopeable per environment -- the
                  # domain identity is one shared account-level resource.
                  - ses:*
                  # Directory Service: connect:CreateInstance provisions an
                  # identity-pool directory behind the scenes. Without these the
                  # API fails with "User is not authorized to perform Check
                  # Alias operation", which names no IAM action at all.
                  # Source: Connect admin guide, "Create instance" permissions.
                  - ds:CheckAlias
                  - ds:CreateAlias
                  - ds:CreateIdentityPoolDirectory
                  - ds:AuthorizeApplication
                  - ds:UnauthorizeApplication
                  - ds:DescribeDirectories
                  - ds:DeleteDirectory
                  # Connect checks its instance quota before creating.
                  - servicequotas:GetServiceQuota
                  - cloudtrail:*
                  - kms:*
                  - secretsmanager:*
                  - bedrock:*
                  - bedrock-agentcore:*
                  - cloudwatch:*
                  - logs:DescribeLogGroups
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:PutRetentionPolicy
                  - logs:TagResource
                  - logs:ListTagsForResource
                  - logs:DescribeMetricFilters
                  - logs:PutMetricFilter
                  - logs:DeleteMetricFilter
                Resource: '*'
              # Connect and SES create their own service-linked roles under
              # role/aws-service-role/*, which the impulsoiq-*-<env> scope on
              # IamScoped* deliberately does not cover.
              - Sid: ServiceLinkedRoles
                Effect: Allow
                Action:
                  - iam:CreateServiceLinkedRole
                  - iam:PutRolePolicy
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/aws-service-role/*'
              # connect:CreateInstance enumerates buckets to place its default
              # storage; ListAllMyBuckets cannot be scoped to a prefix.
              - Sid: ListBucketsForConnect
                Effect: Allow
                Action:
                  - s3:ListAllMyBuckets
                  - s3:GetBucketLocation
                Resource: '*'
              - Sid: CodeBuildLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/*'

  CodeBuildTerraformRoleTest:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-codebuild-terraform-test-role'
      Tags:
        - Key: Project
          Value: ImpulsoIQ
        - Key: Purpose
          Value: TerraformBuildTest
