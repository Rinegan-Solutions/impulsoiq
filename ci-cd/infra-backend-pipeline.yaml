                  - !Sub 'arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/impulsoiq-*-prod'
              - Sid: SchedulerProd
                Effect: Allow
                Action:
                  - scheduler:*
                Resource: !Sub 'arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/impulsoiq-*-prod'
              - Sid: SnsProd
                Effect: Allow
                Action:
                  - sns:*
                Resource: !Sub 'arn:aws:sns:${AWS::Region}:${AWS::AccountId}:impulsoiq-*-prod'
              - Sid: EcrProd
                Effect: Allow
                Action:
                  - ecr:*
                Resource: !Sub 'arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/impulsoiq-*-prod'
              - Sid: EcrAuthToken
                Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: '*'
              - Sid: IamScopedProd
                Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:PassRole
                  # Changing a role's trust policy on an EXISTING role is
                  # UpdateAssumeRolePolicy, not CreateRole -- a distinct action
                  # that CreateRole does not imply. Without it, any edit to an
                  # assume_role_policy fails on the second apply while the first
                  # apply of the same code succeeds.
                  - iam:UpdateAssumeRolePolicy
                  - iam:UpdateRole
                  - iam:UpdateRoleDescription
                  - iam:ListRoleTags
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:TagRole
                  - iam:UntagRole
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/impulsoiq-*-prod'
              - Sid: IamPolicyScopedProd
                Effect: Allow
                Action:
                  - iam:CreatePolicy
                  - iam:DeletePolicy
                  - iam:GetPolicy
                  - iam:GetPolicyVersion
                  - iam:ListPolicyVersions
                  - iam:CreatePolicyVersion
                  - iam:DeletePolicyVersion
                  - iam:TagPolicy
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:policy/impulsoiq-*-prod'
              - Sid: OpaqueIdServices
                Effect: Allow
                Action:
                  - cognito-idp:*
                  - apigateway:*
                  - appsync:*
                  - dsql:*
                  - connect:*
                  # SES: the domain identity and configuration set in
                  # modules/api/ses.tf. Not scopeable per environment -- the
                  # domain identity is one shared account-level resource.
                  - ses:*
                  # Directory Service: connect:CreateInstance provisions an
                  # identity-pool directory behind the scenes. Without these the
                  # API fails with "User is not authorized to perform Check
                  # Alias operation", which names no IAM action at all.
                  # Source: Connect admin guide, "Create instance" permissions.
                  - ds:CheckAlias
                  - ds:CreateAlias
                  - ds:CreateIdentityPoolDirectory
                  - ds:AuthorizeApplication
                  - ds:UnauthorizeApplication
                  - ds:DescribeDirectories
                  - ds:DeleteDirectory
                  # Connect checks its instance quota before creating.
                  - servicequotas:GetServiceQuota
                  - cloudtrail:*
                  - kms:*
                  - secretsmanager:*
                  - bedrock:*
                  - bedrock-agentcore:*
                  - cloudwatch:*
                  - logs:DescribeLogGroups
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:PutRetentionPolicy
                  - logs:TagResource
                  - logs:ListTagsForResource
                  - logs:DescribeMetricFilters
                  - logs:PutMetricFilter
                  - logs:DeleteMetricFilter
                Resource: '*'
              # Connect and SES create their own service-linked roles under
              # role/aws-service-role/*, which the impulsoiq-*-<env> scope on
              # IamScoped* deliberately does not cover.
              - Sid: ServiceLinkedRoles
                Effect: Allow
                Action:
                  - iam:CreateServiceLinkedRole
                  - iam:PutRolePolicy
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/aws-service-role/*'
              # connect:CreateInstance enumerates buckets to place its default
              # storage; ListAllMyBuckets cannot be scoped to a prefix.
              - Sid: ListBucketsForConnect
                Effect: Allow
                Action:
                  - s3:ListAllMyBuckets
                  - s3:GetBucketLocation
                Resource: '*'
              - Sid: CodeBuildLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/*'

  # ─── CodeBuild Projects — Dev ────────────────────────────────────────────────
  # ARM_CONTAINER is required: Lambda functions build for arm64 and AgentCore
  # Runtime containers must target aarch64.

  TerraformValidateDevBuild:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${AWS::StackName}-tf-validate-dev'
      ServiceRole: !GetAtt CodeBuildTerraformRoleDev.Arn
      Source:
        Type: CODEPIPELINE
        BuildSpec: infra-backend/buildspec-validate.yml
      Environment:
        Type: ARM_CONTAINER
        Image: aws/codebuild/amazonlinux2-aarch64-standard:3.0
        ComputeType: BUILD_GENERAL1_SMALL
        EnvironmentVariables:
          - Name: ENV
            Value: dev
      Artifacts:
        Type: CODEPIPELINE
      TimeoutInMinutes: 20
      Tags:
        - Key: Project
          Value: ImpulsoIQ
        - Key: Environment
          Value: dev

  TerraformPlanDevBuild:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${AWS::StackName}-tf-plan-dev'
      ServiceRole: !GetAtt CodeBuildTerraformRoleDev.Arn
      Source:
        Type: CODEPIPELINE
        BuildSpec: infra-backend/buildspec-plan.yml
      Environment:
        Type: ARM_CONTAINER
        Image: aws/codebuild/amazonlinux2-aarch64-standard:3.0
        ComputeType: BUILD_GENERAL1_MEDIUM
        EnvironmentVariables:
          - Name: ENV
            Value: dev
      Artifacts:
        Type: CODEPIPELINE
      TimeoutInMinutes: 45
      Tags:
        - Key: Project
          Value: ImpulsoIQ
        - Key: Environment
          Value: dev

  TerraformDeployDevBuild:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${AWS::StackName}-tf-deploy-dev'
      ServiceRole: !GetAtt CodeBuildTerraformRoleDev.Arn
      Source:
        Type: CODEPIPELINE
        BuildSpec: infra-backend/buildspec-apply.yml
      Environment:
        Type: ARM_CONTAINER
        Image: aws/codebuild/amazonlinux2-aarch64-standard:3.0
        ComputeType: BUILD_GENERAL1_MEDIUM
        EnvironmentVariables:
          - Name: ENV
            Value: dev
      Artifacts:
        Type: CODEPIPELINE
      TimeoutInMinutes: 60
      Tags:
        - Key: Project
          Value: ImpulsoIQ
        - Key: Environment
          Value: dev

