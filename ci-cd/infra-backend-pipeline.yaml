                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                Resource: !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/impulsoiq-tf-lock'
              - Sid: DataBucketsTest
                Effect: Allow
                Action:
                  - s3:*
                Resource:
                  - 'arn:aws:s3:::impulsoiq-*-test'
                  - 'arn:aws:s3:::impulsoiq-*-test/*'
              - Sid: SsmParametersTest
                Effect: Allow
                Action:
                  - ssm:PutParameter
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:GetParametersByPath
                  - ssm:DeleteParameter
                  - ssm:DeleteParameters
                  - ssm:AddTagsToResource
                  - ssm:ListTagsForResource
                  - ssm:RemoveTagsFromResource
                Resource:
                  - !Sub 'arn:aws:ssm:*:${AWS::AccountId}:parameter/impulsoiq/test/*'
                  - !Sub 'arn:aws:ssm:*:${AWS::AccountId}:parameter/impulsoiq/cicd/*'
              - Sid: SsmDescribeParameters
                Effect: Allow
