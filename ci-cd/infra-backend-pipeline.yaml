                  - !GetAtt PipelineArtifactsBucket.Arn
              - Sid: TerraformStateObjectsTest
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: 'arn:aws:s3:::impulsoiq-tf-state/infra-backend/test/*'
              - Sid: TerraformStateBucketList
