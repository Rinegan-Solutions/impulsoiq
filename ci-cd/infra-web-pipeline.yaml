      TimeoutInMinutes: 45
      Tags:
        - Key: Project
          Value: ImpulsoIQ
        - Key: Environment
          Value: dev

  WebAppBuildDev:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${AWS::StackName}-webapp-dev'
      ServiceRole: !GetAtt CodeBuildTerraformRoleDev.Arn
      Source:
        Type: CODEPIPELINE
        BuildSpec: apps/web/buildspec.yml
      Environment:
        Type: LINUX_CONTAINER
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
        ComputeType: BUILD_GENERAL1_SMALL
        EnvironmentVariables:
          - Name: ENV
            Value: dev
      Artifacts:
        Type: CODEPIPELINE
      TimeoutInMinutes: 30
      Tags:
        - Key: Project
          Value: ImpulsoIQ
        - Key: Environment
