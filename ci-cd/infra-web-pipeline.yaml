                  - !Sub 'arn:aws:ssm:*:${AWS::AccountId}:parameter/impulsoiq/prod/backend/*'
              - Sid: SsmDescribeParametersProd
                Effect: Allow
                Action:
                  - ssm:DescribeParameters
                Resource: '*'
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/*'

  # ─── CodeBuild Projects — Tests ──────────────────────────────────────────────

  UnitTestBuild:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${AWS::StackName}-unit-test'
      ServiceRole: !GetAtt CodeBuildUnitTestRole.Arn
      Source:
        Type: CODEPIPELINE
        BuildSpec: apps/web/buildspec-test.yml
      Environment:
        Type: LINUX_CONTAINER
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
        ComputeType: BUILD_GENERAL1_SMALL
      Artifacts:
        Type: CODEPIPELINE
      TimeoutInMinutes: 20
      Tags:
        - Key: Project
          Value: ImpulsoIQ
        - Key: Purpose
          Value: UnitTest

  # ─── CodeBuild Projects — Dev ────────────────────────────────────────────────

  TerraformValidateDevBuild:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${AWS::StackName}-tf-validate-dev'
      ServiceRole: !GetAtt CodeBuildTerraformRoleDev.Arn
      Source:
        Type: CODEPIPELINE
        BuildSpec: infra-web/buildspec-validate.yml
      Environment:
        Type: LINUX_CONTAINER
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
        ComputeType: BUILD_GENERAL1_SMALL
        EnvironmentVariables:
          - Name: ENV
            Value: dev
      Artifacts:
        Type: CODEPIPELINE
      TimeoutInMinutes: 15
      Tags:
        - Key: Project
          Value: ImpulsoIQ
        - Key: Environment
          Value: dev

  TerraformPlanDevBuild:
