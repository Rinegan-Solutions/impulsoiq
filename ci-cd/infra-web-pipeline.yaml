  # ─── Pipeline 1: Non-Prod (develop → unit test → dev → test) ─────────────────
  NonProdPipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub '${AWS::StackName}-nonprod'
      RoleArn: !GetAtt CodePipelineRole.Arn
      PipelineType: V2
      ArtifactStore:
        Type: S3
        Location: !Ref PipelineArtifactsBucket
      Tags:
        - Key: Project
          Value: ImpulsoIQ
        - Key: Environment
          Value: NonProd
      Stages:
        # Stage 1: Source — develop branch
        - Name: Source
          Actions:
            - Name: SourceDev
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: '1'
              OutputArtifacts:
                - Name: SourceOutputDev
              Configuration:
                ConnectionArn: !Ref GitHubConnectionArn
                FullRepositoryId: !Sub '${GitHubOwner}/${GitHubRepo}'
                BranchName: develop
                DetectChanges: true
                OutputArtifactFormat: CODE_ZIP
              RunOrder: 1

        # Stage 2: Unit tests — typecheck + lint + build the React app
        - Name: Test
          Actions:
            - Name: UnitTest
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              InputArtifacts:
                - Name: SourceOutputDev
              OutputArtifacts:
                - Name: UnitTestOutput
              Configuration:
                ProjectName: !Ref UnitTestBuild
              RunOrder: 1

        # Stage 3: Deploy Dev
        - Name: DeployDev
          Actions:
            - Name: TerraformValidateDev
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              InputArtifacts:
                - Name: SourceOutputDev
              OutputArtifacts:
                - Name: TerraformValidateOutputDev
              Configuration:
                ProjectName: !Ref TerraformValidateDevBuild
              RunOrder: 1

            - Name: TerraformPlanDev
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              InputArtifacts:
                - Name: SourceOutputDev
              OutputArtifacts:
                - Name: TerraformPlanOutputDev
              Configuration:
                ProjectName: !Ref TerraformPlanDevBuild
                PrimarySource: SourceOutputDev
              RunOrder: 2

            - Name: ApproveDevDeploy
              ActionTypeId:
                Category: Approval
                Owner: AWS
                Provider: Manual
                Version: '1'
              Configuration:
                CustomData: |
                  DEV ENVIRONMENT DEPLOYMENT APPROVAL

                  Branch: develop
                  Environment: dev

                  Unit tests have passed. Before approving, review the
                  Terraform plan output in the "TerraformPlanDev" action's
                  CodeBuild logs above.

                  Click "Approve" to apply the plan to the DEV environment.
              RunOrder: 3

            - Name: TerraformDeployDev
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              InputArtifacts:
                - Name: SourceOutputDev
                - Name: TerraformPlanOutputDev
              OutputArtifacts:
                - Name: TerraformDeployOutputDev
              Configuration:
                ProjectName: !Ref TerraformDeployDevBuild
                PrimarySource: SourceOutputDev
              RunOrder: 4

            - Name: WebAppBuildDev
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              InputArtifacts:
                - Name: SourceOutputDev
                - Name: TerraformDeployOutputDev
              OutputArtifacts:
                - Name: WebAppBuildOutputDev
              Configuration:
                ProjectName: !Ref WebAppBuildDev
                PrimarySource: SourceOutputDev
              RunOrder: 5

        # Stage 4: Deploy Test
        - Name: DeployTest
          Actions:
            - Name: TerraformValidateTest
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              InputArtifacts:
                - Name: SourceOutputDev
              OutputArtifacts:
                - Name: TerraformValidateOutputTest
              Configuration:
                ProjectName: !Ref TerraformValidateTestBuild
              RunOrder: 1

            - Name: TerraformPlanTest
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              InputArtifacts:
                - Name: SourceOutputDev
              OutputArtifacts:
                - Name: TerraformPlanOutputTest
              Configuration:
                ProjectName: !Ref TerraformPlanTestBuild
                PrimarySource: SourceOutputDev
              RunOrder: 2

            - Name: ApproveTestDeploy
              ActionTypeId:
                Category: Approval
                Owner: AWS
                Provider: Manual
                Version: '1'
              Configuration:
                CustomData: |
                  TEST ENVIRONMENT DEPLOYMENT APPROVAL

                  Branch: develop
                  Environment: test

                  Dev deployment has completed. Before approving, review the
                  Terraform plan output in the "TerraformPlanTest" action's
                  CodeBuild logs above.

                  Click "Approve" to proceed with Test deployment.
              RunOrder: 3

            - Name: TerraformDeployTest
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              InputArtifacts:
                - Name: SourceOutputDev
                - Name: TerraformPlanOutputTest
              OutputArtifacts:
                - Name: TerraformDeployOutputTest
              Configuration:
                ProjectName: !Ref TerraformDeployTestBuild
                PrimarySource: SourceOutputDev
              RunOrder: 4

            - Name: WebAppBuildTest
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              InputArtifacts:
                - Name: SourceOutputDev
                - Name: TerraformDeployOutputTest
              OutputArtifacts:
                - Name: WebAppBuildOutputTest
              Configuration:
                ProjectName: !Ref WebAppBuildTest
                PrimarySource: SourceOutputDev
              RunOrder: 5

  # ─── Pipeline 2: Prod (main → prod, double gate) ─────────────────────────────
  ProdPipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub '${AWS::StackName}-prod'
      RoleArn: !GetAtt CodePipelineRole.Arn
      PipelineType: V2
      ArtifactStore:
        Type: S3
        Location: !Ref PipelineArtifactsBucket
      Tags:
        - Key: Project
          Value: ImpulsoIQ
        - Key: Environment
          Value: prod
      Stages:
        # Stage 1: Source — main branch
        - Name: Source
          Actions:
            - Name: SourceProd
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: '1'
              OutputArtifacts:
                - Name: SourceOutputProd
              Configuration:
                ConnectionArn: !Ref GitHubConnectionArn
                FullRepositoryId: !Sub '${GitHubOwner}/${GitHubRepo}'
                BranchName: main
                DetectChanges: true
                OutputArtifactFormat: CODE_ZIP
              RunOrder: 1

        # Stage 2: Deploy Prod — double gate
        - Name: DeployProd
          Actions:
            - Name: ApproveProdRelease
              ActionTypeId:
                Category: Approval
                Owner: AWS
                Provider: Manual
                Version: '1'
              Configuration:
                CustomData: |
                  PRODUCTION DEPLOYMENT — FIRST GATE (RELEASE WINDOW)

                  Branch: main
                  Environment: prod

                  This gate confirms the release window. Approving starts
                  Terraform validate + plan against PRODUCTION.
                  No infrastructure changes are applied at this gate.
              RunOrder: 1

            - Name: TerraformValidateProd
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              InputArtifacts:
                - Name: SourceOutputProd
              OutputArtifacts:
                - Name: TerraformValidateOutputProd
              Configuration:
                ProjectName: !Ref TerraformValidateProdBuild
              RunOrder: 2

            - Name: TerraformPlanProd
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              InputArtifacts:
                - Name: SourceOutputProd
              OutputArtifacts:
                - Name: TerraformPlanOutputProd
              Configuration:
                ProjectName: !Ref TerraformPlanProdBuild
                PrimarySource: SourceOutputProd
              RunOrder: 3

            - Name: ApproveProdApply
              ActionTypeId:
                Category: Approval
                Owner: AWS
                Provider: Manual
                Version: '1'
              Configuration:
                CustomData: |
                  PRODUCTION DEPLOYMENT — SECOND GATE (APPLY)

                  Branch: main
                  Environment: prod

                  Review the Terraform plan output in the "TerraformPlanProd"
                  action's CodeBuild logs above before approving.

                  Approving APPLIES infrastructure changes to PRODUCTION and
                  publishes the web app to the production CloudFront origin.
              RunOrder: 4

            - Name: TerraformDeployProd
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              InputArtifacts:
                - Name: SourceOutputProd
                - Name: TerraformPlanOutputProd
              OutputArtifacts:
                - Name: TerraformDeployOutputProd
              Configuration:
                ProjectName: !Ref TerraformDeployProdBuild
                PrimarySource: SourceOutputProd
              RunOrder: 5

            - Name: WebAppBuildProd
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              InputArtifacts:
                - Name: SourceOutputProd
                - Name: TerraformDeployOutputProd
              OutputArtifacts:
                - Name: WebAppBuildOutputProd
              Configuration:
                ProjectName: !Ref WebAppBuildProd
                PrimarySource: SourceOutputProd
              RunOrder: 6

Outputs:
  NonProdPipelineName:
    Description: Non-prod pipeline (develop → unit test → dev → test)
    Value: !Ref NonProdPipeline

  ProdPipelineName:
    Description: Prod pipeline (main → prod, double gate)
    Value: !Ref ProdPipeline

  ArtifactsBucketName:
    Description: Shared pipeline artifacts bucket
    Value: !Ref PipelineArtifactsBucket
