AWSTemplateFormatVersion: '2010-09-09'
Description: 'ImpulsoIQ Web Infra CI/CD Pipeline - CodePipeline with GitHub, CodeBuild for Terraform + Vite build (dev + test + prod)'

# Deploy (one stack, both pipelines):
#   aws cloudformation deploy \
#     --template-file ci-cd/infra-web-pipeline.yaml \
#     --stack-name impulsoiq-web-pipeline \
#     --parameter-overrides GitHubOwner=<owner> GitHubRepo=impulsoiq \
#     --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
#     --region eu-west-2
#
# Branch → environment mapping is carried by the ENV variable on each CodeBuild
# project (dev|test|prod), which selects
# infra-web/environments/${ENV}/{backend.hcl,terraform.tfvars}.
#
# infra-web's Terraform config never creates Lambda/Cognito/API GW/DynamoDB
# resources — those grants from the backend template are deliberately omitted.
# CloudFront/Route53/ACM stay on Resource '*' because those services use
# AWS-generated opaque IDs (no name-based ARN for Create*).

Parameters:
  GitHubOwner:
    Type: String
    Description: GitHub repository owner/username
    Default: 'Tolu-Orina'

  GitHubRepo:
    Type: String
    Description: GitHub repository name
    Default: 'impulsoiq'

  GitHubConnectionArn:
    Type: AWS::SSM::Parameter::Value<String>
    Description: SSM parameter holding the CodeConnections GitHub ARN
    Default: /impulsoiq/cicd/codeconnections_arn

Resources:

  # ── Shared artifact bucket (both pipelines) ──────────────────────────────────
  PipelineArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldArtifacts
            Status: Enabled
            ExpirationInDays: 30
      Tags:
        - Key: Project
          Value: ImpulsoIQ
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Purpose
          Value: PipelineArtifacts

  # ── IAM Role for CodePipeline (shared by both pipelines) ─────────────────────
  CodePipelineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-pipeline-role'
      Tags:
        - Key: Project
          Value: ImpulsoIQ
        - Key: Purpose
          Value: CodePipeline
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CodePipelinePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                  - s3:GetBucketVersioning
                  - s3:GetBucketLocation
                Resource:
                  - !Sub '${PipelineArtifactsBucket.Arn}/*'
                  - !GetAtt PipelineArtifactsBucket.Arn
              - Effect: Allow
                Action:
                  - codebuild:BatchGetBuilds
                  - codebuild:StartBuild
                Resource:
                  - !GetAtt UnitTestBuild.Arn
                  - !GetAtt TerraformValidateDevBuild.Arn
                  - !GetAtt TerraformPlanDevBuild.Arn
                  - !GetAtt TerraformDeployDevBuild.Arn
                  - !GetAtt WebAppBuildDev.Arn
                  - !GetAtt TerraformValidateTestBuild.Arn
                  - !GetAtt TerraformPlanTestBuild.Arn
                  - !GetAtt TerraformDeployTestBuild.Arn
                  - !GetAtt WebAppBuildTest.Arn
                  - !GetAtt TerraformValidateProdBuild.Arn
                  - !GetAtt TerraformPlanProdBuild.Arn
                  - !GetAtt TerraformDeployProdBuild.Arn
                  - !GetAtt WebAppBuildProd.Arn
              - Effect: Allow
                Action:
                  - codestar-connections:UseConnection
                  - codeconnections:UseConnection
                Resource: !Ref GitHubConnectionArn

  # ── IAM Role for unit tests ──────────────────────────────────────────────────
  # apps/web/buildspec-test.yml makes no AWS API calls — needs nothing beyond
  # the shared artifact bucket and CloudWatch Logs.
  CodeBuildUnitTestRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-codebuild-unit-test-role'
      Tags:
        - Key: Project
          Value: ImpulsoIQ
        - Key: Purpose
          Value: UnitTestBuild
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CodeBuildUnitTestPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:GetBucketVersioning
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource:
                  - !Sub '${PipelineArtifactsBucket.Arn}/*'
                  - !GetAtt PipelineArtifactsBucket.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/*'

  # ─── IAM Roles for CodeBuild — Terraform + web deploy, split per environment ─

  CodeBuildTerraformRoleDev:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-codebuild-terraform-dev-role'
      Tags:
        - Key: Project
          Value: ImpulsoIQ
        - Key: Purpose
          Value: TerraformBuildDev
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CodeBuildTerraformDevPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: PipelineArtifacts
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:GetBucketVersioning
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource:
                  - !Sub '${PipelineArtifactsBucket.Arn}/*'
                  - !GetAtt PipelineArtifactsBucket.Arn
              - Sid: WebAndLogBucketsDev
                Effect: Allow
                Action:
                  - s3:*
                Resource:
                  - 'arn:aws:s3:::impulsoiq-web-dev'
                  - 'arn:aws:s3:::impulsoiq-web-dev/*'
                  - 'arn:aws:s3:::impulsoiq-logs-dev'
                  - 'arn:aws:s3:::impulsoiq-logs-dev/*'
              - Sid: TerraformStateObjectsDev
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: 'arn:aws:s3:::impulsoiq-tf-state/infra-web/dev/*'
              - Sid: TerraformStateBucketList
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketVersioning
                Resource: 'arn:aws:s3:::impulsoiq-tf-state'
              - Sid: TerraformStateLock
                Effect: Allow
                Action:
                  - dynamodb:DescribeTable
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                Resource: !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/impulsoiq-tf-lock'
              - Effect: Allow
                Action:
                  - cloudfront:*
                Resource: '*'
              - Effect: Allow
                Action:
                  - route53:*
                Resource: '*'
              - Effect: Allow
                Action:
                  - acm:*
                Resource: '*'
              - Sid: SsmParametersDev
                Effect: Allow
                Action:
                  - ssm:PutParameter
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:GetParametersByPath
                  - ssm:DeleteParameter
                  - ssm:DeleteParameters
                  - ssm:AddTagsToResource
                  - ssm:ListTagsForResource
                  - ssm:RemoveTagsFromResource
                Resource:
                  - !Sub 'arn:aws:ssm:*:${AWS::AccountId}:parameter/impulsoiq/dev/web/*'
                  - !Sub 'arn:aws:ssm:*:${AWS::AccountId}:parameter/impulsoiq/dev/backend/*'
              # DescribeParameters is account-scoped (no resource ARN)
              - Sid: SsmDescribeParametersDev
                Effect: Allow
                Action:
                  - ssm:DescribeParameters
                Resource: '*'
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/*'

  CodeBuildTerraformRoleTest:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-codebuild-terraform-test-role'
      Tags:
        - Key: Project
          Value: ImpulsoIQ
        - Key: Purpose
          Value: TerraformBuildTest
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CodeBuildTerraformTestPolicy
