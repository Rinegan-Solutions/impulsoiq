version: 0.2
# Applies the plan produced by buildspec-plan.yml.
# ENV is set by the calling CodeBuild project.
#
# LOCATING THE PLAN
# CodePipeline gives this action two input artifacts. The primary
# (SourceOutput*) lands in $CODEBUILD_SRC_DIR; every secondary artifact lands in
# its own $CODEBUILD_SRC_DIR_<ArtifactName> directory. So tfplan is NOT beside
# the Terraform config — it must be copied in first. Rather than hardcode
# TerraformPlanOutputDev/Test/Prod, the plan is located by search, which keeps
# this buildspec identical across all three environments.
#
# SSM parameters are NOT written here — main.tf declares aws_ssm_parameter
# resources for every value the frontend and agents discover, so Terraform owns
# those paths in state and removes them on destroy. Writing them again from the
# buildspec would create a second, untracked source of truth for the same keys.

phases:
  install:
    commands:
      - yum install -y yum-utils zip
      - yum-config-manager --add-repo https://rpm.releases.hashicorp.com/AmazonLinux/hashicorp.repo
      - yum install -y terraform
      - terraform version

  pre_build:
    commands:
      - |
        set -e
        echo "Locating tfplan from the plan stage's artifact..."

        # CodePipeline exposes each SECONDARY input artifact as its own
        # $CODEBUILD_SRC_DIR_<ArtifactName>. Careful: "$CODEBUILD_SRC_DIR_*" is
        # NOT variable expansion -- the shell reads it as the unset variable
        # $CODEBUILD_SRC_DIR_ followed by a glob, and silently expands to the
        # working directory's entries. Enumerate through env instead.
        PLAN=""
        for d in $(env | sed -n 's/^CODEBUILD_SRC_DIR_[A-Za-z0-9_]*=//p'); do
          if [ -f "$d/infra-backend/tfplan" ]; then PLAN="$d/infra-backend/tfplan"; break; fi
          if [ -f "$d/tfplan" ];               then PLAN="$d/tfplan";               break; fi
        done

        # Fallback: scan the whole artifact tree. Depth varies
        # (/codebuild/output/src<N>/src/s3/01), so no fixed glob is reliable.
        if [ -z "$PLAN" ]; then
          PLAN=$(find /codebuild/output -type f -name tfplan 2>/dev/null | head -1)
        fi

        if [ -z "$PLAN" ]; then
          echo "ERROR: tfplan not found in any input artifact."
          echo "Secondary artifact dirs:"
          env | grep '^CODEBUILD_SRC_DIR' || echo "  (none)"
          echo "Tree:"
          find /codebuild/output -maxdepth 5 -type d 2>/dev/null | head -40
          exit 1
        fi

        echo "Found plan: $PLAN"
        PLANDIR=$(dirname "$PLAN")
        cp "$PLAN" "$CODEBUILD_SRC_DIR/infra-backend/tfplan"

        # Restore the Lambda bundles the plan was computed against. apply
        # re-evaluates filebase64sha256() on every dist.zip, so these must be
        # the exact bytes from the plan stage -- not a rebuild.
        ZIPS=0
        for z in "$PLANDIR"/modules/lambda/codes/*/dist.zip; do
          [ -f "$z" ] || continue
          fn=$(basename "$(dirname "$z")")
          mkdir -p "$CODEBUILD_SRC_DIR/infra-backend/modules/lambda/codes/$fn"
          cp "$z" "$CODEBUILD_SRC_DIR/infra-backend/modules/lambda/codes/$fn/dist.zip"
          ZIPS=$((ZIPS + 1))
        done
        echo "Restored $ZIPS Lambda bundle(s) from the plan artifact."

        EXPECTED=$(find "$CODEBUILD_SRC_DIR/infra-backend/modules/lambda/codes"                      -mindepth 2 -maxdepth 2 -name package.json | wc -l)
        if [ "$ZIPS" -ne "$EXPECTED" ]; then
          echo "ERROR: $EXPECTED Lambda(s) have a package.json but only $ZIPS bundle(s) arrived."
          echo "The plan stage must publish infra-backend/modules/lambda/codes/*/dist.zip."
          exit 1
        fi

  build:
    commands:
      - cd "$CODEBUILD_SRC_DIR/infra-backend"
      - terraform init -backend-config="environments/${ENV}/backend.hcl"
      # A saved plan is only valid against the provider versions that produced
      # it, which is why .terraform.lock.hcl is committed — plan and apply then
      # resolve to identical versions.
      - terraform apply -auto-approve tfplan

  post_build:
    commands:
      # post_build runs even when build FAILED, so this must branch on
      # CODEBUILD_BUILD_SUCCEEDING. Without the check the log ends with
      # "Apply complete for env=prod" directly beneath a failed apply, and
      # terraform-outputs.json is published from a half-applied state.
      - |
        if [ "$CODEBUILD_BUILD_SUCCEEDING" = "1" ]; then
          echo "Apply complete for env=${ENV}"
          cd "$CODEBUILD_SRC_DIR/infra-backend"
          terraform output -json > terraform-outputs.json
        else
          echo "Apply FAILED for env=${ENV} - not exporting outputs."
          echo '{}' > "$CODEBUILD_SRC_DIR/infra-backend/terraform-outputs.json"
        fi

artifacts:
  files:
    - infra-backend/terraform-outputs.json
  discard-paths: no
