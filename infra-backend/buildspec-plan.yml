version: 0.2
# Runs terraform plan and emits the plan file consumed by buildspec-apply.yml.
# ENV is set by the calling CodeBuild project.
#
# Same bundling requirement as validate — see buildspec-validate.yml for why
# dev dependencies must be installed.

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - yum install -y yum-utils zip
      - yum-config-manager --add-repo https://rpm.releases.hashicorp.com/AmazonLinux/hashicorp.repo
      - yum install -y terraform

  pre_build:
    commands:
      - cd "$CODEBUILD_SRC_DIR"
      - npm ci --no-audit --no-fund
      - |
        set -e
        for dir in "$CODEBUILD_SRC_DIR"/infra-backend/modules/lambda/codes/*/; do
          if [ -f "$dir/package.json" ]; then
            echo "── bundling $(basename "$dir") ──"
            ( cd "$dir" && npm run build )
          fi
        done

  build:
    commands:
      - cd "$CODEBUILD_SRC_DIR/infra-backend"
      - terraform init -backend-config="environments/${ENV}/backend.hcl"
      - terraform plan -var-file="environments/${ENV}/terraform.tfvars" -out=tfplan
      - echo "Plan complete for env=${ENV}"

artifacts:
  files:
    - infra-backend/tfplan
    # The dist.zip bundles built in pre_build MUST travel with the plan.
    # terraform apply re-evaluates the config, so filebase64sha256() runs
    # again on every Lambda zip. If apply rebuilt them instead of reusing
    # these, esbuild output could differ and the saved plan would no longer
    # match. Shipping the exact bytes the plan was computed against is the
    # only way apply stays faithful to what was approved.
    - infra-backend/modules/lambda/codes/*/dist.zip
  discard-paths: no
