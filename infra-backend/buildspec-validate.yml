version: 0.2
# Runs terraform validate. ENV is set by the calling CodeBuild project.
#
# Lambda bundles MUST be built before validate: aws_lambda_function uses
# filebase64sha256() on dist.zip, and Terraform evaluates that during validate —
# not just plan. A missing dist.zip fails validate outright.
#
# The Lambda packages are npm workspaces of the repo root, so a single root
# `npm ci` installs all of them from the committed root lockfile. Dev
# dependencies are required here (esbuild and typescript are devDependencies),
# so do NOT pass --omit=dev.

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - yum install -y yum-utils zip
      - yum-config-manager --add-repo https://rpm.releases.hashicorp.com/AmazonLinux/hashicorp.repo
      - yum install -y terraform
      - terraform version
      - node --version

  pre_build:
    commands:
      - echo "Validating environment=${ENV}"
      - cd "$CODEBUILD_SRC_DIR"
      # One reproducible install for every workspace, including all Lambdas.
      - npm ci --no-audit --no-fund
      - |
        set -e
        for dir in "$CODEBUILD_SRC_DIR"/infra-backend/modules/lambda/codes/*/; do
          if [ -f "$dir/package.json" ]; then
            echo "── bundling $(basename "$dir") ──"
            ( cd "$dir" && npm run build )
          fi
        done

  build:
    commands:
      - cd "$CODEBUILD_SRC_DIR/infra-backend"
      - terraform init -backend-config="environments/${ENV}/backend.hcl"
      - terraform validate
      - echo "Validate succeeded for env=${ENV}"
