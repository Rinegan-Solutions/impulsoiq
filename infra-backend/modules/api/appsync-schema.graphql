type AgentAction @aws_iam @aws_cognito_user_pools {
  id: ID!
  tenantId: String!
  agentRunId: String!
  agentType: String!
  action: String!
  status: String!
  input: AWSJSON
  output: AWSJSON
  occurredAt: AWSDateTime!
}

type Mutation {
  publishAgentAction(input: AgentActionInput!): AgentAction
    @aws_iam
}

input AgentActionInput {
  id: ID!
  tenantId: String!
  agentRunId: String!
  agentType: String!
  action: String!
  status: String!
  input: AWSJSON
  output: AWSJSON
  occurredAt: AWSDateTime!
}

type Subscription {
  onAgentAction(tenantId: String!): AgentAction
    @aws_subscribe(mutations: ["publishAgentAction"])
    @aws_cognito_user_pools
}

type Query {
  listRecentActions(tenantId: String!, limit: Int): [AgentAction]
    @aws_cognito_user_pools
}
